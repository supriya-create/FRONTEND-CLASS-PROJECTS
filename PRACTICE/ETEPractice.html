<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .body{
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
        }
        .header{
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background:#ff6b00 ;
            color: white;

        }
        .logo{
            font-size: 24px;
            font-weight: bold;
        }
        .navbar{
            display: flex;
            gap: 20px;
        }
        .navbar a{
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .hero{
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            align-items: center;
            text-align: center;
        }
        .hero-text h1{
            font-size: 2 rem;
            margin-bottom: 15px;
        }
        .hero-text p{
            margin-bottom: 20 px;
        }
        .hero button{
            padding: 12 px 20 px;
            border: none;
            background: darkkhaki;
            color: white;
            font-size: 16px;
            border-radius: 5px;
        }
        .menu{
            padding: 40px 20px;
            text-align: center;
        }
        .menu h2{
            margin-bottom: 30px;
        }
        .menu-grid{
            display: grid;
            gap:20px;
        }
        .card{
            background: darkgrey;
            padding: 20px;
            border-radius: 10px;
        }
        .card img{
            width: 100%;
            border-radius: 10px;
        }
        .card h3{
            margin: 15px 0 10px;
        }
        .footer{
            background: darkslategray;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">Punjabi Tadka</div>
        <nav class="navbar">
            <a href="">Home</a>
            <a href="">Menu</a>
            <a href="">Offers</a>
            <a href="">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-text">
            <h1>Authentic Punjabi Food Delivered Fast</h1>
            <p>Enjoy delicious Amritsari dishes at your doorstep.</p>
            <button>Order Now</button>

            <div class="hero-img">
                <img src="imageeee.jpeg" alt="Punjabi Food">
            </div>
        </div>
    </section>

    <section class="Menu">
        <h2>Popular Dishes</h2>
        <div class="menu-grid">
            <div class="card">
                <img src="imageeee.jpeg" alt="">
                <h3>Item 1</h3>
                <p>₹99</p>
            </div>
            <div class="card">
                <img src="imageeee.jpeg" alt="">
                <h3>Item 2</h3>
                <p>₹300</p>
            </div>
            <div class="card">
                <img src="imageeee.jpeg" alt="">
                <h3>Item 3</h3>
                <p>₹200</p>
            </div>

        </div>
    </section>

    <footer class="footer">
        <p>© 2026 Punjabi Tadka | Amritsar</p>
    </footer>
</body>
</html>
