<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }
        form{
            width: 300px;
        }
        input{
            width:100%;
            padding: 8px;
            margin: 8px 0;
        }
        .preview{
            margin-top: 20px;
            padding: 15px;
            border: 1px solid gray;
            width: 300px;
        }
        .error{
            color: red;
            font-size: 10px;
        }
        button{
            padding: 10px 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Student Registration Form</h1>
    <form id="studentForm">
        <label>Name: </label>
        <input type="text" id="name">
        <div id="nameError" class="error"></div>

        <label>Age:</label>
        <input type="number" id="age">
        <div id="ageError" class="error"></div>

        <label>Courses:</label><br>
        <input type="checkbox" value="NodeJS" class="course">NodeJS<br>
        <input type="checkbox" value="Java" class="course">JAVA<br>
        <input type="checkbox" value="Python" class="course">Python<br>
        <input type="checkbox" value="Cpp" class="course">Cpp<br>

        <button type="submit">Register</button>
    </form>

    <div class="preview">
        <h3>Live Preview</h3>
        <p><strong>Name:</strong><span id="previewName"></span></p>
        <p><strong>Age:</strong><span id="previewAge"></span></p>
        <p><strong>Courses:</strong><span id="previewCourses"></span></p>
    </div>

    <h3 id="successMessage"></h3>

    <script>
        let students = [];
        const form = document.getElementById("studentForm");
        const nameInput = document.getElementById("name");
        const ageInput = document.getElementById("age");
        const nameError = document.getElementById("nameError");
        const ageError = document.getElementById("ageError");
        const previewName = document.getElementById("previewName");
        const previewAge = document.getElementById("previewAge");
        const previewCourses = document.getElementById("previewCourses");
        const successMessage = document.getElementById("successMessage");

        function validateName(){
            if(nameInput.value.trim()==""){
                nameError.innerHTML = "Name cannot be empty";
                return false;
            }else{
                nameError.innerHTML = "";
                return true;
            }
        }

        const validateAge = () =>{
            let age = Number(ageInput.value);
            if(age<18 || age>30){
                ageError.innerHTML = "Age must be between 18 and 30";
                return false;
            }else{
                ageError.innerHTML = "";
                return true;
                }
        };

        function getSelectedCourses(){
            let selectedCourses = [];
            const courses = document.querySelectorAll(".course");
            courses.forEach((course) => {
                if(course.checked){
                    selectedCourses.push(course.value);
                }
            });
            return selectedCourses;
        }

        function updatePreview(){
            previewName.innerHTML = nameInput.value;
            previewAge.innerHTML = ageInput.value;
            previewCourses.innerHTML = getSelectedCourses().join(",");
        }

        nameInput.addEventListener("input", ()=>{
            validateName();
            updatePreview();
        });

        ageInput.addEventListener("input", ()=>{
            validateAge();
            updatePreview();
        });

        document.querySelectorAll(".course").forEach((checkbox)=>{
            checkbox.addEventListener("change", updatePreview);
        });

        form.addEventListener("submit", function(event){
            event.preventDefault();

            let isNameValid = validateName();
            let isAgeValid = validateAge();

            if(isNameValid && isAgeValid){
                let student = {
                    name: nameInput.value,
                    age: ageInput.value,
                    courses: getSelectedCourses()
                };

                students.push(student);

                successMessage.innerHTML = "Registration Successful! Total students registered: "+students.length;

                form.reset();

                previewName.innerHTML = "";
                previewAge.innerHTML = "";
                previewCourses.innerHTML = "";

                console.log(students);
            }else{
                successMessage.innerHTML = "";
            }
        });
    </script>
</body>
</html>
