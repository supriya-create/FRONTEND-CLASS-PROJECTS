<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="box">
        <!-- or -->
        <h1 id="head1">This is heading1 inside div</h1>
        <h2 id="head2">This is heading1 inside div</h2>
        <p id="para1">This is para1 inside div</p>
        <p id="para2">This is para2 inside div</p>
        <ul id="list1">
            <li>Item1</li>
            <li>Item2</li>
            <li>Item3</li>
        </ul>
    </div>
    <div id="box2">
        Hello
        <h2 style="display: none;">this is new class</h2>
    </div>
    <script>
        //type of html collection - array
        let b1 = document.getElementById("box2");
        console.log(b1.innerHTML);
        console.log(b1.innerText);
        console.log(b1.textContent);
        
        let para1 = document.getElementById("para1");
        console.log(para1.parentElement);
        console.log(para1.previousElementSibling);
        console.log(para1.nextElementSibling);
        console.log(para1.firstChild);  //works on node list
        console.log(para1.lastChild);

        let ul = document.getElementById("list1");
        console.log(ul.parentElement);
    

        let box1 = document.getElementById("box");
        console.log(box1.firstElementChild); //works on element list
        console.log(box1.lastElementChild);
        console.log(box1.children);   //only elements -> only tags
        console.log(box1.childNodes); //text Nodes, elements, comments


        para1.addEventListener("click", function() {
            para1.nextElementSibling.style.color = "green";;
        });
        //innerText - show text that are visible 
        //textcontent - show text which is hidden and visible 
    </script>
</body>
</html>
